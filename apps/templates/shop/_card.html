<a class="card" href="{% url 'product' p.slug %}">
  {% if p.image %}<img src="{{ p.image.url }}" alt="{{ p.name }}">{% else %}<div class="img">{{ p.name|first }}</div>{% endif %}
  <div class="body">
    <h3>{{ p.name }}</h3>
    <p>{{ p.short_description }}</p>
    <span class="price">${{ p.price }}</span>
  </div>
</a>
