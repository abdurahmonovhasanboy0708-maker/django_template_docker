<!DOCTYPE html>
<html lang="uz">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}Magazin{% endblock %}</title>
  <style>
    *{box-sizing:border-box}
    body{margin:0;font-family:system-ui,sans-serif;background:#f5f6f8;color:#222}
    header{background:#1f2937;color:#fff;padding:14px 24px;display:flex;justify-content:space-between;align-items:center;gap:16px;flex-wrap:wrap}
    header a{color:#fff;text-decoration:none;font-weight:700;font-size:20px}
    header form{display:flex;gap:8px}
    header input{padding:8px 12px;border-radius:6px;border:0}
    header button{padding:8px 14px;border:0;border-radius:6px;background:#3b82f6;color:#fff;cursor:pointer}
    main{max-width:1100px;margin:24px auto;padding:0 16px}
    .cats{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:20px}
    .cats a{padding:8px 16px;border-radius:20px;background:#fff;color:#333;text-decoration:none;border:1px solid #ddd}
    .cats a.active{background:#3b82f6;color:#fff;border-color:#3b82f6}
    .grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(240px,1fr));gap:20px}
    .card{background:#fff;border-radius:12px;overflow:hidden;box-shadow:0 1px 4px rgba(0,0,0,.08);text-decoration:none;color:inherit;display:block}
    .card .img{height:180px;background:#e5e7eb;display:flex;align-items:center;justify-content:center;font-size:56px;color:#9ca3af}
    .card img{width:100%;height:180px;object-fit:cover;display:block}
    .card .body{padding:14px}
    .card h3{margin:0 0 6px;font-size:17px}
    .card p{margin:0 0 10px;color:#666;font-size:14px}
    .price{font-weight:700;color:#16a34a;font-size:18px}
    .detail{display:grid;grid-template-columns:1fr 1fr;gap:32px;background:#fff;padding:24px;border-radius:12px}
    .detail img,.detail .img{width:100%;height:380px;object-fit:cover;border-radius:10px;background:#e5e7eb;display:flex;align-items:center;justify-content:center;font-size:96px;color:#9ca3af}
    @media(max-width:700px){.detail{grid-template-columns:1fr}}
    footer{text-align:center;color:#888;padding:24px}
  </style>
</head>
<body>
  <header>
    <a href="{% url 'home' %}">Magazin</a>
    <form method="get" action="{% url 'home' %}">
      <input name="q" placeholder="Qidiruv..." value="{{ q|default:'' }}">
      <button>Izlash</button>
    </form>
  </header>
  <main>{% block content %}{% endblock %}</main>
  <footer>Django + MinIO demo</footer>
</body>
</html>
